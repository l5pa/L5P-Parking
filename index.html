<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFD200">
    <meta name="description" content="Find nearby points of interest on an interactive map">
    
    <title>Little 5 Points Parking Map</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="src/styles.css">
    
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-27K8D1W21R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-27K8D1W21R');
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Little 5 Points Parking Map</h1>
            <button id="locationBtn" class="location-btn" aria-label="Get current location">
                📍
            </button>
        </header>
        
        <main>
            <div id="mapContainer" class="map-container">
                <div id="map"></div>
                <div id="loading" class="loading hidden">
                    <div class="spinner"></div>
                    <p>Finding your location...</p>
                </div>
            </div>
            
            <div id="poiList" class="poi-list">
                <div id="poiCards" class="poi-cards">
                    <p class="no-location">Enable location access to see nearby points of interest</p>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Config: real values injected at deploy time by GitHub Actions; locally use config.local.js -->
    <script src="config.js"></script>
    <script>
        // Fallback for local dev: if config.js wasn't found, inject config.local.js.
        // document.write during initial parsing is synchronous, so APP_CONFIG is set
        // before later scripts run.
        if (typeof window.APP_CONFIG === 'undefined') {
            document.write('<script src="config.local.js"><\/script>');
        }
    </script>
    <script src="src/data.js"></script>
    <script src="src/utils.js"></script>
    <script src="src/engine-loader.js"></script>
    <script src="src/app.js"></script>
</body>
</html>
